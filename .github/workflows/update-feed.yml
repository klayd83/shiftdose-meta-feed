name: Validate Meta product feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate feed structure
        shell: bash
        run: |
          python - <<'PY'
          import csv
          required = {"id","title","description","availability","condition","price","link","image_link","brand"}
          with open("feed.csv", encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit("feed.csv is empty")
          missing = required - set(rows[0].keys())
          if missing:
              raise SystemExit(f"Missing columns: {sorted(missing)}")
          ids = [r["id"] for r in rows]
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate product IDs found")
          if any("__trashed" in r["link"] for r in rows):
              raise SystemExit("Trashed product URLs found")
          print(f"Validated {len(rows)} catalog products.")
          PY
